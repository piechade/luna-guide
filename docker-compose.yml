services:
  luna:
    build: .
    container_name: luna-guide
    restart: unless-stopped
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health"]
      interval: 60s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.luna.rule=Host(`luna.dpiecha.de`)
      - traefik.http.routers.luna.entrypoints=https
      - traefik.http.routers.luna.tls=true
      - traefik.http.routers.luna.tls.certresolver=leresolver
      - traefik.http.services.luna.loadbalancer.server.port=80
      - traefik.docker.network=proxy

networks:
  proxy:
    external: true
