# Luna Guide — static site. The Dockerfile installs this file as /etc/nginx/nginx.conf
# (the complete configuration, not a conf.d snippet). TLS ends at Traefik; this
# server only speaks plain HTTP on port 80 inside the Docker network.

user nginx;
# The container is limited to a quarter of a CPU core and 64 MB. "auto" would
# start one worker per core of the host.
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/plain application/javascript application/json application/manifest+json image/svg+xml;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" enc=$sent_http_content_encoding';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    # Longer than Traefik's 90 s idle timeout, so the proxy never reuses a
    # connection that this side has just closed.
    keepalive_timeout 120s;

    # ── Compression ──────────────────────────────────────────────────────────
    # Nothing is compressed at request time. The build (vite.config.ts) writes a
    # maximum-level copy of every text file:
    #   file.gz      served by gzip_static below
    #   /_br/file    Brotli. Stock nginx has no Brotli module, so the copies keep
    #                their file name in a parallel tree: a client that accepts
    #                "br" is served from /_br/, the Content-Type still follows
    #                the file extension, and Content-Encoding is added below.
    # Do not add "gzip on": the gzip filter does not know the /_br/ files are
    # already encoded and would compress them a second time.
    map $http_accept_encoding $br_root {
        default                                "";
        "~*\bbr\s*;\s*q=0(\.0+)?\s*(,|$)"      "";      # Brotli explicitly refused
        "~*\bbr\b"                             "/_br";
    }
    map $uri $content_encoding {
        default     "";
        ~^/_br/     "br";
    }

    # ── Caching ──────────────────────────────────────────────────────────────
    # /assets/ file names contain a content hash: cache them for a year, never
    # revalidate. Everything else (index.html above all) is revalidated on every
    # visit; a cached index.html pointing at bundles of an older deploy would
    # leave visitors with an empty stage.
    map $uri $cache_control {
        default               "no-cache";
        ~^(/_br)?/assets/     "public, max-age=31536000, immutable";
    }

    # Only promise HTTPS for requests that actually arrived over HTTPS at Traefik.
    map $http_x_forwarded_proto $hsts {
        default     "";
        https       "max-age=15552000";
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        root /usr/share/nginx/html;

        gzip_static on;

        # Every header is set here, at server level, and no location adds its own:
        # an add_header inside a location would silently drop all of these.
        # Without "always" a header is only sent with 2xx/3xx answers, so a 404
        # is never cached as immutable.
        add_header Cache-Control $cache_control;
        add_header Content-Encoding $content_encoding;
        add_header Vary "Accept-Encoding";

        # The page loads its own scripts, styles, icons and manifest and nothing
        # else: no inline <script>/<style>, no style="" attributes, no eval, no
        # web fonts, no workers, no frames, no third-party host. "data:" is for the
        # inline SVG favicon. The app itself never fetches; connect-src 'self' only
        # keeps same-origin requests by browser tooling (audits, devtools) working.
        # three.js needs none of the excluded features.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security $hsts always;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            try_files $br_root/index.html /index.html =404;
        }

        # Real files only. There is no client-side routing, so an unknown path is
        # a 404 and not a copy of index.html.
        location / {
            try_files $br_root$uri $uri =404;
        }

        # The Brotli tree is reached through try_files above, never by its own URL.
        location /_br/ {
            internal;
        }
    }
}
